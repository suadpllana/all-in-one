# Netlify config: Vite SPA + the device-sync function (netlify/functions/).
# Local dev with functions: `npx netlify dev` (proxies vite + functions).

[build]
  command = "npm run build"
  publish = "dist"

# Pinned: vite 8 and eslint 10 need node ^20.19 || ^22.13 || >=24. Netlify's
# default varies by site age, so an unpinned build can land on an older node
# and fail on engines.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# SPA fallback so react-router deep links work. Function routes under
# /.netlify/functions/* are matched before this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
